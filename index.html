<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美式生活館｜生活實況英語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="life.css">
<style>
/* 單元版：版面沿用舊版（標題區、單元橫向捲動列、三個分頁、語速與遮蔽按鈕），內容區沿用新版的奶油底卡片（life.css） */
.wrap{max-width:980px}
.u-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid #2D5343;margin-bottom:18px}
.u-brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.u-badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--chalk-yellow);border:1.5px solid rgba(232,185,74,.55);background:rgba(232,185,74,.1);border-radius:999px;padding:7px 16px}
.u-sub{font-size:13px;color:#9AA89C}
.u-links{display:flex;gap:8px;flex-wrap:wrap}
.u-links a{font-size:13px;font-weight:700;color:var(--paper);text-decoration:none;opacity:.85}
.u-links a:hover{color:var(--chalk-yellow);opacity:1}
.u-hero h1{font-family:'Kalam','Noto Sans TC',cursive;font-weight:700;font-size:clamp(30px,6vw,46px);line-height:1.25;color:var(--paper);margin-bottom:6px}
.u-hero h1 .u-zh{font-family:'Noto Sans TC',sans-serif;font-weight:900}
.u-hero h1 .u-en{font-family:'Kalam',cursive;font-size:.5em;font-weight:400;font-style:italic;color:var(--chalk-yellow);margin-left:8px;white-space:nowrap}
.u-sit{font-size:15px;color:var(--paper);margin-top:10px}
.u-sit b{color:var(--chalk-yellow)}
.u-desc{font-size:14px;color:#B9C7BB;line-height:1.7;margin-top:4px}
.u-prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;border:1px solid #2D5343;background:rgba(255,255,255,.03);border-radius:999px;padding:10px 20px;font-size:14px;font-weight:700}
.u-prog .bar{flex:1;min-width:120px;height:10px;border-radius:999px;background:#12261E;border:1px solid #2D5343;overflow:hidden}
.u-prog .bar span{display:block;height:100%;width:0;background:var(--chalk-yellow);transition:width .3s}
.u-block{background:#1A352B;border:1px solid #2D5343;border-radius:18px;padding:16px 18px;margin-top:16px}
.u-selhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--chalk-green);margin-bottom:12px}

.u-rowlbl{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;color:#8DA595;align-self:center;min-width:52px}
.u-track.expanded{flex-wrap:wrap;overflow:visible;scroll-snap-type:none}

.u-exp:hover{border-color:var(--chalk-yellow);color:var(--chalk-yellow)}
.u-eyebrow{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--chalk-green);margin-bottom:4px}
/* 冊別（第一層）與生活區（第二層）：上下兩列、標籤對齊，生活區會跟著選到的冊別變化 */
.u-filters{background:#142820;border:1px solid #2D5343;border-radius:14px;padding:10px 12px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.u-frow{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:start}
.u-flbl{font-size:12px;font-weight:700;color:#8DA595;padding-top:8px;letter-spacing:.04em}
.u-fchips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.u-f{border:1.5px solid #2D5343;background:transparent;color:var(--paper);font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;white-space:nowrap}
.u-f small{opacity:.7;margin-left:5px;font-weight:400;font-size:11px}
.u-f:hover:not(.on):not(:disabled){border-color:var(--chalk-yellow)}
.u-f.on{background:var(--chalk-yellow);border-color:var(--chalk-yellow);color:#1B3A2F}
.u-f.on small{opacity:.8}
.u-f:disabled{opacity:.32;cursor:default}
.u-sub{color:#9AA89C;font-size:13px;padding:8px}
.u-chip .bk{font-size:10px;color:var(--chalk-green);border:1px solid #2D5343;border-radius:999px;padding:0 6px}
.u-chip.active .bk{color:#1B3A2F;border-color:rgba(27,58,47,.4)}
@media (max-width:620px){.u-frow{grid-template-columns:1fr;gap:4px}.u-flbl{padding-top:0}}
.u-chip.off{opacity:.45;cursor:default}
.u-chip.off:hover{border-color:#2D5343}
.u-chip .soon{font-size:11px;color:var(--chalk-yellow)}
.u-track-wrap{position:relative;display:flex;align-items:center;gap:8px}
.u-arrow{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:1.5px solid #2D5343;background:#142820;color:var(--paper);font-size:16px;font-weight:700}
.u-arrow:hover{border-color:var(--chalk-yellow);color:var(--chalk-yellow)}
.u-track{flex:1;min-width:0;display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#6E8C7A #12261E}
.u-track::-webkit-scrollbar{height:8px}
.u-track::-webkit-scrollbar-track{background:#12261E;border-radius:999px}
.u-track::-webkit-scrollbar-thumb{background:#6E8C7A;border-radius:999px}
.u-chip{flex-shrink:0;scroll-snap-align:center;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1.5px solid #2D5343;background:#162E25;color:var(--paper);border-radius:14px;padding:11px 16px;font-size:15px;position:relative}
.u-chip .no{font-weight:700}
.u-chip .tt{font-size:12px;opacity:.85}
.u-chip:hover:not(.active){border-color:var(--chalk-yellow)}
.u-chip.active{background:var(--chalk-yellow);border-color:var(--chalk-yellow);color:#1B3A2F;font-weight:700}
.u-chip .pill{font-size:11px;font-weight:700;background:var(--chalk-green);color:#10261C;border-radius:999px;padding:1px 7px}
.u-ctrl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.u-tabs{display:flex;gap:4px;flex-wrap:wrap;background:#142820;border:1px solid #2D5343;border-radius:24px;padding:5px;flex:1 1 380px}
.u-tab{border:none;background:transparent;color:rgba(247,243,232,.85);font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px}
.u-tab.active{background:var(--chalk-yellow);color:#1B3A2F}
.u-aux{display:flex;gap:8px;flex-wrap:wrap}
.u-aux-btn{border:1.5px solid #2D5343;background:#162E25;color:var(--paper);font-weight:700;font-size:13px;padding:10px 16px;border-radius:12px}
.u-aux-btn.on{background:var(--chalk-yellow);border-color:var(--chalk-yellow);color:#1B3A2F}
.u-card{margin-top:16px}
.u-card .no{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft);margin-right:6px}
.u-full{display:inline-block;margin-top:14px;font-size:14px;font-weight:700;color:var(--deep);text-decoration:none;border:1.5px solid var(--deep);border-radius:999px;padding:8px 16px}
.u-full:hover{background:var(--deep);color:var(--paper)}
.u-foot{text-align:center;color:#6B7D72;font-size:12px;margin-top:34px;line-height:1.8}
.u-loading{padding:30px;text-align:center;color:var(--ink-soft)}
.peek-hint{font-size:13px;color:var(--ink-soft);margin-bottom:10px}
@media (max-width:620px){.u-arrow{display:none}.u-block{padding:14px 12px}.u-tab{padding:9px 12px;font-size:13px}.u-prog{border-radius:18px}}
</style>

<body>
<div class="wrap">
  <div class="u-top">
    <div class="u-brand"><span class="u-badge">🏛️ 美式生活館｜American Life Hub</span><span class="u-sub">生活化實用美語・情境對話隨身聽</span></div>
    <div class="u-links"><a href="catalog.html">🔎 全部 44 個場景卡片</a><a href="classic.html">📜 舊版</a><a href="https://jenlin2002.github.io/">← 回首頁總入口</a></div>
  </div>

  <div class="u-hero">
    <div class="u-eyebrow" id="hBook"></div>
    <h1 id="hTitle"></h1>
    <div class="u-sit">情境核心：<b id="hSit"></b></div>
    <div class="u-desc" id="hDesc"></div>
    <div class="u-prog"><span id="hProgText"></span><div class="bar"><span id="hProgBar"></span></div></div>
  </div>

  <div class="u-block">
    <div class="u-selhead"><span>單元目錄切換 (UNIT SELECTION) :</span><span class="cnt" id="selCnt"></span></div>
    <div class="u-filters">
      <div class="u-frow"><span class="u-flbl">① 冊別</span><div class="u-fchips" id="bookRow"></div></div>
      <div class="u-frow"><span class="u-flbl">② 生活區</span><div class="u-fchips" id="zoneRow"></div></div>
    </div>
    <div class="u-track-wrap">
      <button class="u-arrow" id="arrL" aria-label="往左">‹</button>
      <div class="u-track" id="track"></div>
      <button class="u-arrow" id="arrR" aria-label="往右">›</button>
    </div>
    <div class="u-expwrap"><button class="u-exp" id="expBtn" type="button">☰ 展開全部單元</button></div>
  </div>

  <div class="u-block u-ctrl">
    <div class="u-tabs" id="tabs"></div>
    <div class="u-aux">
      <button class="u-aux-btn" id="bSpeed">語速：<span id="lSpeed">1x</span></button>
      <button class="u-aux-btn" id="bHideEn">👁 遮蔽英文</button>
      <button class="u-aux-btn" id="bHideZh">👁 遮蔽中文</button>
    </div>
  </div>

  <div class="card u-card" id="content"><div class="u-loading">載入中…</div></div>
  <div class="u-foot">練習結果會自動同步到 Google 試算表。沒有錄好語音的句子，會改用裝置內建的英文語音播放。<br>美式生活館 American Life Hub · BRANDEN &amp; MELISSA 成長學習館</div>
</div>

<script src="catalog.js"></script>
<script src="units-list.js"></script>
<script src="points.js"></script>
<script>
(function(){
// 冊別與單元：資料在 units-list.js（冊 → 單元，數量不限）。沒編進任何一冊、但 catalog.js 標了 ready 的場景，會自動收進最後一冊「更多場景」。
const CAT = window.LIFE_CATALOG || { zones: [], scenes: [] };
const BOOKS = (window.UNIT_BOOKS || []).map(b => Object.assign({}, b));
const UL = [];           // 攤平的全部單元：id = 全域序號，no = 在該冊裡的第幾單元，book = 冊別 id
(function(){
  let gid = 0; const listed = new Set();
  BOOKS.forEach(b => (b.units || []).forEach((u, i) => {
    listed.add(u.slug);
    const cs = CAT.scenes.find(s => s.slug === u.slug) || {};      // 只填 slug 時，名稱從 catalog.js 補
    UL.push(Object.assign({ title: cs.title || u.slug, titleEn: cs.en || '' }, u, { id: ++gid, no: i + 1, book: b.id, ready: !!cs.ready, zone: cs.zone }));
  }));
  const extra = CAT.scenes.filter(s => s.ready && !listed.has(s.slug));
  if(extra.length){
    const b = { id: 'more', name: '更多場景', sub: '已完成但還沒編進冊別的場景（自動收錄，請到 units-list.js 編進冊別）' };
    BOOKS.push(b);
    extra.forEach((s, i) => UL.push({ slug: s.slug, title: s.title, titleEn: s.en, id: ++gid, no: i + 1, book: b.id, ready: true, zone: s.zone }));
  }
})();
const DEFAULT_SYNC_URL = "https://script.google.com/macros/s/AKfycbwqd9cr_3MfXK8hzs8Y-YPQQUqOH5vKtW_vMav1nMAAt9VkBCP_5WP6Q1TDngIlr51U/exec";
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has = a => Array.isArray(a) && a.length > 0;
const mem = {};
const get = k => { try{ return localStorage.getItem(k); }catch(e){ return (k in mem) ? mem[k] : null; } };
const set = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){ mem[k] = v; } };

// ---------- 語音（和 engine.js 同一套：先播 mp3，沒有就用裝置語音）----------
function speechText(t){
  if(t.indexOf(' / ') < 0) return t;
  const alts = t.split(' / ');
  return alts.slice(0, -1).every(a => /[.!?]$/.test(a.trim())) ? alts.join(' ') : alts.join(' or ');
}
function audioKey(voice, fast, text){
  const bytes = new TextEncoder().encode(voice + '|' + (fast ? 'fast' : 'n') + '|' + text);
  let h = 0x811c9dc5;
  for(let i = 0; i < bytes.length; i++){ h ^= bytes[i]; h = Math.imul(h, 0x01000193) >>> 0; }
  return 'a' + h.toString(16).padStart(8, '0');
}
let speed = parseFloat(get('lifeSpeed') || '1') || 1;
if(speed !== 1 && speed !== 0.75) speed = 1;
let curAudio = null, chainToken = 0;
const synth = typeof window.speechSynthesis !== 'undefined' ? window.speechSynthesis : null;
let voices = [];
function loadVoices(){ if(synth) voices = synth.getVoices(); }
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }
function pickVoice(code){
  const male = /^m/.test(code || '');
  const en = voices.filter(v => v.lang && v.lang.startsWith('en'));
  const fem = /female|samantha|zira|jenny|aria|ava|allison|susan|karen|victoria|google us english/i;
  const mal = /\bmale|alex|david|guy|daniel|fred|tom|aaron|google uk english male/i;
  const want = male ? mal : fem;
  const rank = v => (want.test(v.name) ? 8 : 0) + (/natural|neural|online|google/i.test(v.name) ? 4 : 0) + (v.lang === 'en-US' ? 2 : 0);
  return en.sort((a, b) => rank(b) - rank(a))[0] || null;
}
function stopAll(){
  chainToken++;
  if(synth) synth.cancel();
  if(curAudio){ curAudio.pause(); curAudio = null; }
  document.querySelectorAll('.playing').forEach(b => b.classList.remove('playing'));
  document.querySelectorAll('.bubble.now').forEach(b => b.classList.remove('now'));
}
function play(text, voice, btn, opts){
  opts = opts || {};
  text = speechText(text);
  if(!opts.keep) stopAll();
  const token = chainToken, rate = opts.rate || speed;
  return new Promise(resolve => {
    let done = false;
    const finish = () => { if(done) return; done = true; if(btn) btn.classList.remove('playing'); resolve(token === chainToken); };
    if(btn) btn.classList.add('playing');
    const tts = () => {
      if(!synth){ finish(); return; }
      if(!voices.length) loadVoices();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = (opts.fast ? 1.2 : 0.95) * rate;
      const v = pickVoice(voice); if(v) u.voice = v;
      u.onend = u.onerror = finish;
      synth.speak(u);
    };
    const a = new Audio('scenes/' + S.slug + '/audio/' + audioKey(voice, opts.fast, text) + '.mp3');
    a.playbackRate = rate;
    let fell = false;
    const fb = () => { if(fell) return; fell = true; tts(); };
    a.addEventListener('error', fb);
    a.addEventListener('ended', finish);
    const p = a.play();
    if(p && p.catch) p.catch(e => { if(!(e && e.name === 'AbortError')) fb(); });
    curAudio = a;
  });
}
const sayBtn = (text, voice, small, fast) => `<button class="say${small ? ' small' : ''}" type="button" data-text="${esc(text)}" data-v="${esc(voice)}"${fast ? ' data-fast="1"' : ''} aria-label="播放">🔊</button>`;
document.addEventListener('click', e => {
  const b = e.target.closest('.say');
  if(b) play(b.dataset.text, b.dataset.v, b, { fast: !!b.dataset.fast });
});

// ---------- 狀態 ----------
let S = null;                 // 目前單元的場景資料
let unitId = 1, tab = 'matrix';
let hideEn = false, hideZh = false;
const cache = {};
const unitOf = id => UL.find(u => u.id === id) || UL[0];
const SP = () => S.speakers || {};
const V = k => (SP()[k] || {}).voice || 'f';
const isYou = k => k === 'Y' || !!(SP()[k] || {}).you;
const doneKey = () => 'lifeDone:' + S.slug;
function readDone(slug){ try{ return JSON.parse(get('lifeDone:' + slug) || '{}') || {}; }catch(e){ return {}; } }

function loadScene(slug){
  return new Promise((res, rej) => {
    if(cache[slug]) return res(cache[slug]);
    const s = document.createElement('script');
    s.src = 'scenes/' + slug + '/scene.js';
    s.onload = () => { cache[slug] = window.SCENE; s.remove(); res(window.SCENE); };
    s.onerror = () => { s.remove(); rej(new Error('load ' + slug)); };
    document.head.appendChild(s);
  });
}

// ---------- 單元列 ----------
// 兩層連動篩選：① 冊別（含「全部」）→ ② 生活區（8 區固定排列，這一冊沒有的區會變淡不能點，數字是「已完成/總數」）。
// 單元列顯示「選到的冊別 ∩ 選到的生活區」。換冊時，若目前的生活區在新的一冊裡沒有，就自動回到「全部」。
const ZONES = CAT.zones.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
const bookOf = id => BOOKS.find(b => b.id === id);
let view = { book: BOOKS.length ? BOOKS[0].id : 'all', zone: 'all' };
const inScope = (u, bk, zn) => (bk === 'all' || u.book === bk) && (zn === 'all' || u.zone === zn);
const cnt = l => `${l.filter(u => u.ready).length}/${l.length}`;
function renderZones(){
  $('#bookRow').innerHTML = [{ id: 'all', name: '全部冊別', sub: '' }].concat(BOOKS).map(b =>
    `<button class="u-f${view.book === b.id ? ' on' : ''}" data-id="${esc(b.id)}" title="${esc(b.sub || '')}">${esc(b.name)}<small>${cnt(UL.filter(u => inScope(u, b.id, 'all')))}</small></button>`).join('');
  $('#zoneRow').innerHTML = [{ id: 'all', emoji: '🗂', name: '全部生活區' }].concat(ZONES).map(z => {
    const l = UL.filter(u => inScope(u, view.book, z.id)), dis = z.id !== 'all' && !l.length;
    return `<button class="u-f${view.zone === z.id ? ' on' : ''}" data-id="${esc(z.id)}"${dis ? ' disabled' : ''}>${z.emoji} ${esc(z.name)}<small>${cnt(l)}</small></button>`;
  }).join('');
}
$('#bookRow').addEventListener('click', e => {
  const b = e.target.closest('.u-f'); if(!b) return;
  view.book = b.dataset.id === 'all' ? 'all' : (BOOKS.find(x => String(x.id) === b.dataset.id) || {}).id;
  if(view.zone !== 'all' && !UL.some(u => inScope(u, view.book, view.zone))) view.zone = 'all';
  renderZones(); renderTrack(true);
});
$('#zoneRow').addEventListener('click', e => {
  const b = e.target.closest('.u-f'); if(!b || b.disabled) return;
  view.zone = b.dataset.id; renderZones(); renderTrack(true);
});
let expanded = false;
$('#expBtn').addEventListener('click', () => { expanded = !expanded; applyExpand(); });
function applyExpand(){
  $('#track').classList.toggle('expanded', expanded);
  $('#expBtn').textContent = expanded ? '↔ 收合成一列' : '☰ 展開全部單元';
  $('#arrL').style.visibility = $('#arrR').style.visibility = expanded ? 'hidden' : '';
}
function renderTrack(fromZone){
  const tag = u => view.book === 'all' && bookOf(u.book) ? `<span class="bk">${esc(bookOf(u.book).name)}</span>` : '';   // 看「全部冊別」時，標出是哪一冊
  const chip = (u, n) => `<button class="u-chip${u.id === unitId ? ' active' : ''}" data-id="${u.id}"><span>${u.icon || '🎧'}</span><span class="no">Unit ${u.no}</span>${tag(u)}<span class="tt">${esc(u.title)}</span>${n ? `<span class="pill">${n}</span>` : ''}</button>`;
  const soon = u => `<span class="u-chip off"><span>🕒</span><span class="no">Unit ${u.no}</span>${tag(u)}<span class="tt">${esc(u.title)}</span><span class="soon">即將推出</span></span>`;
  const one = u => u.ready ? chip(u, Object.keys(readDone(u.slug)).length) : soon(u);
  const list = UL.filter(u => inScope(u, view.book, view.zone)), b = bookOf(view.book), z = ZONES.find(x => x.id === view.zone);
  $('#track').innerHTML = list.length ? list.map(one).join('') : '<span class="u-sub">這個組合還沒有單元</span>';

// 🎧 聽力測驗
function drawListen(c){
  const Q = S.listening; let i = 0, score = 0, hist = [];
  const render = () => {
    if(i >= Q.length){
      c.innerHTML = `<div class="result"><h2>聽力測驗完成</h2><div class="score">${score} / ${Q.length}</div>

      return;
    }
    const q = Q[i], voice = V(q.speaker || 'S');

      <button class="bigplay" id="qPlay">🔊 播放</button> <span style="font-size:13px;color:var(--ink-soft)">（正常語速，可以重複聽）</span>
      <div class="qprompt">${esc(q.prompt)}</div>
      <div class="opts">${q.options.map((o, k) => `<button class="opt" data-k="${k}">(${String.fromCharCode(65 + k)}) ${esc(o)}</button>`).join('')}</div>
      <div class="fb" id="qFb"></div><button class="next" id="qNext" disabled>下一題 →</button>`;
    const pb = $('#qPlay');

    c.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      const k = +b.dataset.k, ok = k === q.answer;
      c.querySelectorAll('.opt').forEach(x => { x.disabled = true; if(+x.dataset.k === q.answer) x.classList.add('correct'); });
      if(ok) score++; else b.classList.add('wrong');
      hist.push({ q: q.audio, picked: q.options[k], correct: q.options[q.answer], isCorrect: ok });
      const fb = $('#qFb'); fb.className = 'fb show ' + (ok ? 'ok' : 'no');
      fb.innerHTML = (ok ? '✓ 答對了！' : '✕ 再聽一次看看。') + `<br>原句：<b>${esc(q.audio)}</b><br>${esc(q.note)}`;

// 🎤 即時回應（角色扮演）
let roleTimer = null, roleRec = null;
function drawRole(c){
  const R = S.roleplay, SR = window.SpeechRecognition || window.webkitSpeechRecognition, secs = S.answerSeconds || 8, oth = other();
  let i = 0, score = 0, hist = [], results = [];
  const stopRec = () => { if(roleTimer){ clearInterval(roleTimer); roleTimer = null; } if(roleRec){ try{ roleRec.abort(); }catch(e){} roleRec = null; } };
  const render = () => {
    stopRec();
    if(i >= R.length){
      c.innerHTML = `<div class="result"><h2>即時回應完成</h2><div class="score">${score} / ${R.length}</div>
        <div class="msg">${score === R.length ? '太棒了！每一句都接得上。' : '沒通過的句子，先聽示範再練一次。'}</div>
        <div class="rows" style="text-align:left">${results.map(x => `<div class="row"><div class="txt"><div class="zh">${esc(x.prompt)}</div>
          <div class="en">${x.ok ? '✓' : '✕'} ${esc(x.said || '（沒有回答）')}</div><div class="reply">示範：<b>${esc(x.model)}</b></div></div></div>`).join('')}</div>
        <button class="next" id="rAgain">再演一次</button><div class="sync" id="rSync"></div></div>`;
      $('#rAgain').addEventListener('click', () => { i = 0; score = 0; hist = []; results = []; render(); });
      sync('即時回應', score, R.length, hist, $('#rSync'));
      return;
    }
    const r = R[i];
    c.innerHTML = `<div class="qtop"><div class="qnum">第 ${i + 1} 句 / ${R.length}</div><div class="qtag">角色扮演</div></div>${whoHtml()}
      <p class="lead">${esc(oth.zh)}會先說一句話，聽完後<b>馬上</b>回答。按麥克風開始說，有 ${secs} 秒。</p>
      <div class="rp-stage">
        <div class="rp-staff"><span class="avatar">${oth.avatar || ''}</span>${sayBtn(r.prompt, V('S'))}<span class="en hidden" id="rStaff">${esc(r.prompt)}</span></div>
        <div class="rp-hint">提示：${esc(r.hint)}　<a href="#" id="rShow" style="color:var(--deep)">看${esc(oth.zh)}說了什麼</a></div>
        ${SR ? `<button class="mic" id="rMic">🎤 按這裡開始說</button><span class="timer" id="rTimer"></span>` : `<div class="rp-hint">這個瀏覽器不支援語音辨識，請把你要說的話打在下面（建議用 Chrome 或 Safari）。</div>`}
        <div class="heard"><div class="lbl">你說的是</div><div id="rHeard"></div></div>
        ${SR ? '' : '<input class="typed" id="rTyped" placeholder="輸入你的回答" autocomplete="off">'}
        <div class="btnrow">${SR ? '' : '<button class="ghost" id="rSubmit">送出</button>'}<button class="ghost" id="rSkip">我說完了 / 看示範</button></div>
        <div class="fb" id="rFb"></div>
      </div>
      <button class="next" id="rNext" disabled>下一句 →</button>`;
    $('#rShow').addEventListener('click', e => { e.preventDefault(); $('#rStaff').classList.remove('hidden'); });
    let said = '', judged = false;
    const judge = () => {
      if(judged) return; judged = true; stopRec();
      const ok = new RegExp(r.expect, 'i').test(said);
      if(ok) score++;
      hist.push({ q: r.prompt, picked: said, correct: r.model, isCorrect: ok });
      results.push({ prompt: r.promptZh, said, ok, model: r.model });
      const fb = $('#rFb'); fb.className = 'fb show ' + (ok ? 'ok' : 'no');
      fb.innerHTML = (ok ? '✓ 很好，這樣回答對方聽得懂！' : (said ? '✕ 好像還少了關鍵說法，' : '✕ 沒有收到回答，') + '聽聽看示範：') +
        `<br>示範：<b>${esc(r.model)}</b> ${sayBtn(r.model, V('Y'), true)}<br><span class="zh">${esc(r.modelZh)}</span>`;
      $('#rStaff').classList.remove('hidden'); $('#rNext').disabled = false;
    };
    $('#rSkip').addEventListener('click', judge);
    if(!SR){
      const t = $('#rTyped');
      const submit = () => { said = t.value.trim(); $('#rHeard').textContent = said; judge(); };
      $('#rSubmit').addEventListener('click', submit);
      t.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
    } else {
      const mic = $('#rMic');
      mic.addEventListener('click', () => {
        if(roleRec){ judge(); return; }
        stopAll();
        try{
          roleRec = new SR(); roleRec.lang = 'en-US'; roleRec.interimResults = true; roleRec.continuous = true;
          roleRec.onresult = ev => { said = Array.prototype.map.call(ev.results, x => x[0].transcript).join(' ').trim(); $('#rHeard').textContent = said; };
          roleRec.onerror = ev => { if(ev.error === 'not-allowed') $('#rHeard').textContent = '（麥克風沒有開啟權限）'; };
          roleRec.start();
        }catch(e){ roleRec = null; $('#rHeard').textContent = '（無法啟動麥克風）'; return; }
        mic.classList.add('rec'); mic.textContent = '■ 說完了';
        let left = secs; $('#rTimer').textContent = left;
        roleTimer = setInterval(() => { left--; $('#rTimer').textContent = left > 0 ? left : ''; if(left <= 0) judge(); }, 1000);
      });
    }
    $('#rNext').addEventListener('click', () => { stopAll(); i++; render(); });
  };
  render();
}

  const playLine = (i, keep) => {
    const l = d.lines[i], b = bubbles[i];
    bubbles.forEach(x => x.classList.remove('now')); b.classList.add('now');
    b.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    return play(l.en, V(l.s), null, { keep }).then(ok => { b.classList.remove('now'); return ok; });
  };
  bubbles.forEach((b, i) => b.addEventListener('click', () => { b.classList.add('revealed'); playLine(i); }));
  const btn = $('#playAll');
  btn.addEventListener('click', async () => {
    if(btn.classList.contains('playing')){ stopAll(); btn.textContent = '▶ 播放整段對話'; return; }
    stopAll(); btn.classList.add('playing'); btn.textContent = '■ 停止';
    for(let i = 0; i < d.lines.length; i++){
      if(!(await playLine(i, true))) break;
      await new Promise(r => setTimeout(r, 350));
    }
    btn.classList.remove('playing'); btn.textContent = '▶ 播放整段對話';
  });
}

// 🎧 聽力默寫（聽一句、打出來，大小寫和標點不計；成績同步到試算表）
let student = get('quizStudentName') || '';
if(window.Points) Points.setNameGetter(() => student);
function whoHtml(){
  const isOther = student && student !== 'BRANDEN' && student !== 'MELISSA';
  return `<div class="id-row" style="justify-content:flex-start;margin-bottom:12px"><span class="lbl" style="color:var(--ink-soft)">目前是誰在練習：</span>
    <button class="id-btn ${student === 'BRANDEN' ? 'active' : ''}" data-n="BRANDEN" style="color:var(--ink);border-color:var(--line)">BRANDEN</button>
    <button class="id-btn ${student === 'MELISSA' ? 'active' : ''}" data-n="MELISSA" style="color:var(--ink);border-color:var(--line)">MELISSA</button>
    <button class="id-btn ${isOther ? 'active' : ''}" data-n="__other" style="color:var(--ink);border-color:var(--line)">${isOther ? esc(student) : '其他'}</button></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('.id-btn'); if(!b) return;
  let n = b.dataset.n;
  if(n === '__other'){ n = (window.prompt('請輸入你的名字（英文或中文都可以）', '') || '').trim(); if(!n) return; }
  student = n; set('quizStudentName', n);
  document.querySelectorAll('.id-row').forEach(r => { r.outerHTML = whoHtml(); });
});
async function sync(mode, score, total, details, el){
  if(window.Points) Points.earn({ name: student, label: 'Life｜' + S.title, mode, correct: score, total });
  const url = get('quizSyncUrl') || DEFAULT_SYNC_URL;
  if(!student){ el.textContent = '☁️ 尚未選擇是誰在練習，成績未回傳（請點上方名字）'; return; }
  el.textContent = '☁️ 同步中...';
  try{
    await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ name: student, week: 'Life｜' + S.title, mode, score, total, percent: Math.round(score / total * 100), details }) });
    el.textContent = '☁️ 已送出同步，可到試算表確認';
  }catch(e){ el.textContent = '☁️ 同步失敗，請檢查網路連線'; }
}
let dictState = { slug: '', i: 0, score: 0, hist: [] };
function drawDict(c){
  const D = (has(S.phrases) ? S.phrases : []).filter(x => x.en.indexOf(' / ') < 0);
  if(dictState.slug !== S.slug) dictState = { slug: S.slug, i: 0, score: 0, hist: [] };
  const norm = t => t.toLowerCase().replace(/[‘’`]/g, "'").replace(/[“”]/g, '"').replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
  const st = dictState;
  const render = () => {
    if(st.i >= D.length){
      c.innerHTML = `<div class="result"><h2>聽寫練習完成</h2><div class="score">${st.score} / ${D.length}</div>
        <div class="msg">第一次就寫對的句子有 ${st.score} 句。</div><button class="next" id="dAgain">再練一次</button><div class="sync" id="dSync"></div></div>`;
      $('#dAgain').addEventListener('click', () => { st.i = 0; st.score = 0; st.hist = []; render(); });
      sync('聽寫練習', st.score, D.length, st.hist, $('#dSync'));
      return;
    }
    const x = D[st.i], voice = V(x.s || 'Y'); let tries = 0;
    c.innerHTML = `<h2>聽力默寫／盲聽測驗</h2><p class="lead">按 🔊 聽一句，把聽到的英文打出來（大小寫和標點不計）。聽不懂可以按「慢速」，或看中文提示。</p>${whoHtml()}
      <div class="qtop"><div class="qnum">第 ${st.i + 1} 句 / ${D.length}</div><div class="qtag">聽寫</div></div>
      <div class="btnrow"><button class="bigplay" id="dPlay">🔊 播放</button><button class="ghost" id="dSlow">🐢 慢速</button><button class="ghost" id="dHint">看中文提示</button></div>
      <div class="rp-hint" id="dZh" hidden style="margin-top:10px">${esc(x.zh)}</div>
      <input class="typed" id="dIn" placeholder="把聽到的句子打出來" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="btnrow"><button class="ghost" id="dCheck">檢查</button><button class="ghost" id="dShow">看答案</button></div>
      <div class="fb" id="dFb"></div><button class="next" id="dNext" disabled>下一句 →</button>${fullLink()}`;
    const pb = $('#dPlay');
    pb.addEventListener('click', () => play(x.en, voice, pb, { rate: 1 }));
    $('#dSlow').addEventListener('click', e => play(x.en, voice, e.currentTarget, { rate: 0.7 }));
    $('#dHint').addEventListener('click', () => { $('#dZh').hidden = false; });
    let finished = false;
    const finish = ok => {
      if(finished) return; finished = true;
      if(ok && tries === 1) st.score++;
      st.hist.push({ q: x.en, picked: $('#dIn').value, correct: x.en, isCorrect: ok && tries === 1 });
      $('#dNext').disabled = false;
    };
    const check = () => {
      const v = $('#dIn').value; if(!v.trim()) return; tries++;
      const want = norm(x.en).split(' '), got = norm(v).split(' '), fb = $('#dFb');
      if(want.join(' ') === got.join(' ')){
        fb.className = 'fb show ok'; fb.innerHTML = `✓ 完全正確！<br><b>${esc(x.en)}</b><br><span class="zh">${esc(x.zh)}</span>`; finish(true);
      } else {
        const miss = want.filter(w => got.indexOf(w) < 0);
        fb.className = 'fb show no';
        fb.innerHTML = `✕ 還差一點，${miss.length ? '漏掉或拼錯的字有 ' + miss.length + ' 個' : '字的順序不太對'}。再聽一次，改好後再按「檢查」，或按「看答案」。`;
      }
    };
    $('#dCheck').addEventListener('click', check);
    $('#dIn').addEventListener('keydown', e => { if(e.key === 'Enter') check(); });
    $('#dShow').addEventListener('click', () => { const fb = $('#dFb'); fb.className = 'fb show no'; fb.innerHTML = `答案：<b>${esc(x.en)}</b><br><span class="zh">${esc(x.zh)}</span>`; finish(false); });
    $('#dNext').addEventListener('click', () => { stopAll(); st.i++; render(); });
  };
  render();
}

// ---------- 切換單元 ----------
async function selectUnit(id, first){
  if(!(unitOf(id) || {}).ready) return;         // 還沒做好的單元不能點
  stopAll(); unitId = id;
  const c = $('#content'); c.innerHTML = '<div class="u-loading">載入中…</div>';
  const u = unitOf(id);
  try{ S = await loadScene(u.slug); }
  catch(e){ c.innerHTML = '<div class="u-loading">這個單元載入失敗，請重新整理再試一次。</div>'; return; }
  dlgCur = 0;
  if(view.book !== 'all' && view.book !== u.book) view.book = u.book;            // 選到別冊的單元時，單元列跟著換冊
  if(view.zone !== 'all' && view.zone !== u.zone) view.zone = 'all';
  try{ history.replaceState(null, '', '#b=' + u.book + '&u=' + u.no); }catch(e){}
  renderZones(); renderTrack(); applyExpand(); renderHero(); renderTabs(); renderContent();
  if(!first) window.scrollTo({ top: 0, behavior: 'smooth' });
}
// 網址：#b=冊別&u=第幾單元（#u=3 等於第一冊的 Unit 3；也支援 ?u=3）
const hs = location.hash + location.search;
const hb = (hs.match(/[#&?]b=([\w-]+)/) || [])[1], hu = (hs.match(/[#&?](?:unit|u)=(\d+)/) || [])[1];
const hslug = (hs.match(/[#&?]s=([a-z0-9-]+)/) || [])[1];     // #s=場景名稱：從場景頁「返回單元列表」回到同一個單元
const startUnit = (hslug && UL.find(u => u.ready && u.slug === hslug))
  || UL.find(u => u.ready && String(u.book) === (hb || String(BOOKS[0] && BOOKS[0].id)) && u.no === parseInt(hu || '1', 10)) || UL.find(u => u.ready);
if(startUnit){ view = { book: startUnit.book, zone: 'all' }; selectUnit(startUnit.id, true); }
else $('#content').innerHTML = '<div class="u-loading">還沒有單元。請先在 units-list.js 加入單元。</div>';
})();
</script>
