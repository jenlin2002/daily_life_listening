<style>
  :root{

  }
  header{
    padding:16px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  .title-block{ display:flex; flex-direction:column; gap:2px; }
  .eyebrow{
    font-family:'Space Mono', monospace; font-size:11px; letter-spacing:3px;
    color:var(--yellow); font-weight:700;
  }
  h1{ font-family:'Kalam', cursive; font-size:22px; }
  .header-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn{
    font-family:'Noto Sans TC'; font-size:13px; font-weight:700; cursor:pointer;
    border:1.5px solid var(--yellow); background:transparent; color:var(--yellow);
    padding:8px 14px; border-radius:20px; transition:background 0.15s, color 0.15s;
  }
  .btn:hover{ background:var(--yellow); color:var(--bg); }
  .btn.primary{ background:var(--yellow); color:var(--bg); }
  .btn.primary:hover{ opacity:0.85; }
  .btn.danger{ border-color:var(--red); color:var(--red); }
  .btn.danger:hover{ background:var(--red); color:var(--paper); }

  .layout{ flex:1; display:flex; overflow:hidden; }

  nav{
    width:230px; flex-shrink:0; background:var(--bg2); border-right:1px solid var(--line);
    overflow-y:auto; padding:12px 0;
  }
  .unit-btn{
    display:block; width:100%; text-align:left; background:transparent; border:none;
    color:var(--paper); font-family:'Noto Sans TC'; font-size:14px; padding:11px 18px;
    cursor:pointer; border-left:3px solid transparent; transition:background 0.15s;
  }
  .unit-btn:hover{ background:rgba(255,255,255,0.05); }
  .unit-btn.active{ background:rgba(232,185,74,0.12); border-left-color:var(--yellow); color:var(--yellow); font-weight:700; }
  .unit-num{ font-family:'Space Mono', monospace; font-size:11px; opacity:0.7; margin-right:6px; }
  .unit-progress{ font-size:11px; opacity:0.6; margin-top:2px; }

  main{ flex:1; overflow-y:auto; padding:24px 28px 60px; }
  .unit-header{ margin-bottom:18px; }
  .unit-header h2{ font-family:'Kalam', cursive; font-size:26px; color:var(--paper); margin-bottom:4px; }
  .unit-header .sub{ font-size:13px; color:#9AA89C; }

  .toolbar{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }

  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left; font-size:12px; color:var(--yellow); font-weight:700;
    padding:8px 10px; border-bottom:1.5px solid var(--line); font-family:'Space Mono', monospace; letter-spacing:1px;
  }
  tbody tr{ border-bottom:1px solid var(--line); }
  tbody tr:hover{ background:rgba(255,255,255,0.02); }
  td{ padding:8px 10px; vertical-align:top; }
  td.num{ font-family:'Space Mono', monospace; font-size:13px; color:#9AA89C; width:36px; padding-top:14px; }
  td.check{ width:40px; text-align:center; padding-top:12px; }
  td.play{ width:44px; text-align:center; padding-top:8px; }
  td.del{ width:36px; text-align:center; padding-top:10px; }

  textarea.cell-input{
    width:100%; min-height:38px; resize:vertical; background:var(--bg2); color:var(--paper);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-family:'Noto Sans TC'; font-size:14px;
    line-height:1.4;
  }
  textarea.cell-input.en{ font-style:italic; }
  textarea.cell-input:focus{ outline:none; border-color:var(--yellow); }

  input[type="checkbox"]{
    width:18px; height:18px; accent-color:var(--yellow); cursor:pointer;
  }

  .play-btn{
    width:30px; height:30px; border-radius:50%; border:1.5px solid var(--green);
    background:transparent; color:var(--green); font-size:13px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:background 0.15s, color 0.15s;
  }
  .play-btn:hover{ background:var(--green); color:var(--bg); }
  .play-btn.playing{ background:var(--yellow); border-color:var(--yellow); color:var(--bg); animation:pulse 0.9s infinite; }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 rgba(232,185,74,0); }
    50%{ box-shadow:0 0 10px rgba(232,185,74,0.8); }
  }

  .del-btn{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--line);
    background:transparent; color:#9AA89C; font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:border-color 0.15s, color 0.15s;
  }
  .del-btn:hover{ border-color:var(--red); color:var(--red); }

  .empty-hint{
    text-align:center; padding:60px 20px; color:#9AA89C; font-size:14px; line-height:1.8;
  }

  .section-divider{
    margin:34px 0 18px; padding-top:22px; border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  .section-divider h3{ font-family:'Kalam', cursive; font-size:20px; color:var(--paper); }
  .section-divider .eyebrow{ display:block; margin-bottom:2px; }

  .dialogue-list{ display:flex; flex-direction:column; gap:10px; max-width:720px; }
  .dialogue-row{ display:flex; align-items:flex-start; gap:10px; }
  .dialogue-row.speaker-B{ flex-direction:row-reverse; }

  .speaker-badge{
    flex-shrink:0; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono', monospace; font-weight:700; font-size:13px; margin-top:4px;
  }
  .speaker-badge.A{ background:var(--green); color:var(--bg); }
  .speaker-badge.B{ background:var(--yellow); color:var(--bg); }

  .dialogue-bubble{
    flex:1; max-width:78%; background:var(--bg2); border:1px solid var(--line); border-radius:14px;
    padding:10px 12px; display:flex; flex-direction:column; gap:6px;
  }
  .dialogue-row.speaker-B .dialogue-bubble{ border-color:rgba(232,185,74,0.35); }
  .dialogue-bubble-top{ display:flex; align-items:center; gap:8px; }
  .dialogue-bubble textarea.cell-input{ min-height:32px; font-size:14px; }
  .dialogue-bubble .zh-input{ font-size:13px; opacity:0.9; }

  .speaker-select{
    background:var(--bg2); color:var(--paper); border:1px solid var(--line); border-radius:6px;
    font-family:'Space Mono', monospace; font-size:12px; padding:3px 6px; cursor:pointer;
  }

  footer{
    padding:10px 20px; border-top:1px solid var(--line); font-size:12px; color:#9AA89C;
    text-align:center;
  }

  @media (max-width: 720px){
    .layout{ flex-direction:column; }
    nav{ width:100%; max-height:160px; border-right:none; border-bottom:1px solid var(--line); }
    main{ padding:16px; }
  }
</style>

  const STORAGE_KEY = "listening_practice_data_v1";
  let data = loadData();
  let currentUnit = 0;

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    // 沒有存檔紀錄時，使用預設的原創範例句子
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }

  function saveData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }catch(e){
      alert("儲存失敗，瀏覽器儲存空間可能已滿。建議先匯出備份。");
    }
  }

  function ensureUnitArray(idx){
    if(!data[idx]){
      data[idx] = { sentences: [], dialogue: [] };
      return;
    }
    // 相容舊格式（舊版是直接存句子陣列，沒有sentences/dialogue分層）
    if(Array.isArray(data[idx])){
      data[idx] = { sentences: data[idx], dialogue: [] };
      return;
    }
    if(!data[idx].sentences) data[idx].sentences = [];
    if(!data[idx].dialogue) data[idx].dialogue = [];
  }

  // ---------- 語音播放（穩健版）----------
  const speechSupported = typeof window.speechSynthesis !== 'undefined';
  let cachedVoices = [];
  function refreshVoiceCache(){ if(speechSupported) cachedVoices = window.speechSynthesis.getVoices(); }
  if(speechSupported){
    refreshVoiceCache();
    window.speechSynthesis.onvoiceschanged = refreshVoiceCache;
  }
  function pickVoice(lang){
    if(!cachedVoices.length) refreshVoiceCache();
    const prefix = lang.split('-')[0];
    const exactLocal = cachedVoices.find(v => v.lang === lang && v.localService === true);
    if(exactLocal) return exactLocal;
    const prefixLocal = cachedVoices.find(v => v.lang && v.lang.startsWith(prefix) && v.localService === true);
    if(prefixLocal) return prefixLocal;
    const exact = cachedVoices.find(v => v.lang === lang);
    if(exact) return exact;
    return cachedVoices.find(v => v.lang && v.lang.startsWith(prefix)) || null;
  }
  function whenVoicesReady(cb){
    if(cachedVoices.length > 0){ cb(); return; }
    refreshVoiceCache();
    if(cachedVoices.length > 0){ cb(); return; }
    let done = false;
    const finish = () => { if(done) return; done = true; cb(); };
    window.speechSynthesis.onvoiceschanged = () => { refreshVoiceCache(); finish(); };
    setTimeout(finish, 400);
  }
  let warmedUp = false;
  function warmUp(){
    if(warmedUp || !speechSupported) return;
    warmedUp = true;
    try{
      const w = new SpeechSynthesisUtterance(' ');
      w.volume = 0; w.rate = 10;
      window.speechSynthesis.speak(w);
    }catch(e){}
  }
  document.addEventListener('click', warmUp, { once:true, capture:true });

  function speakText(text, btnEl){
    if(!speechSupported || !text || !text.trim()) return;
    whenVoicesReady(() => {
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      document.querySelectorAll('.play-btn').forEach(b => b.classList.remove('playing'));
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.85;
      const v = pickVoice('en-US');
      if(v) utter.voice = v;
      if(btnEl) btnEl.classList.add('playing');
      utter.onend = () => { if(btnEl) btnEl.classList.remove('playing'); };
      utter.onerror = () => { if(btnEl) btnEl.classList.remove('playing'); };
      window.speechSynthesis.speak(utter);
    });
  }

  // ---------- 畫面渲染 ----------
  function renderNav(){
    const nav = document.getElementById('unitNav');
    nav.innerHTML = '';
    UNITS.forEach((title, i) => {
      ensureUnitArray(i);
      const rows = data[i].sentences;
      const doneCount = rows.filter(r => r.done).length;
      const b = document.createElement('button');
      b.className = 'unit-btn' + (i === currentUnit ? ' active' : '');
      b.innerHTML = `<span class="unit-num">U${i+1}</span>${title}` +
        (rows.length ? `<div class="unit-progress">${doneCount} / ${rows.length} 背完</div>` : '');
      b.addEventListener('click', () => { currentUnit = i; render(); });
      nav.appendChild(b);
    });
  }

      ${rows.length === 0 ? `

      ` : `

            </tr>
          </thead>
          <tbody id="rowsBody"></tbody>
        </table>
      `}

      <div class="section-divider">
        <div>
          <span class="eyebrow">DIALOGUE</span>
          <h3>情境對話</h3>
        </div>
        <div class="toolbar" style="margin:0;">
          <button class="btn primary" id="addLineBtn">＋ 新增台詞</button>
          <button class="btn" id="playDialogueBtn">▶ 播放整段對話</button>
        </div>
      </div>
      ${dlg.length === 0 ? `
        <div class="empty-hint">
          這個單元還沒有情境對話。<br>
          點「＋ 新增台詞」開始輸入 A、B 兩人的對話內容。
        </div>
      ` : `<div class="dialogue-list" id="dialogueList"></div>`}
    `;

    document.getElementById('addRowBtn').addEventListener('click', () => {
      data[currentUnit].sentences.push({ en: '', zh: '', done: false });
      saveData();
      render();
    });
    document.getElementById('playAllBtn').addEventListener('click', () => playAllInUnit());
    document.getElementById('addLineBtn').addEventListener('click', () => {
      const last = dlg[dlg.length - 1];
      const nextSpeaker = last && last.speaker === 'A' ? 'B' : 'A';
      data[currentUnit].dialogue.push({ speaker: nextSpeaker, en: '', zh: '' });
      saveData();
      render();
    });
    document.getElementById('playDialogueBtn').addEventListener('click', () => playAllDialogue());

    if(rows.length > 0){
      const tbody = document.getElementById('rowsBody');
      rows.forEach((row, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="num">${idx + 1}</td>
          <td><textarea class="cell-input en" data-field="en" data-idx="${idx}" placeholder="英文句子...">${escapeHtml(row.en)}</textarea></td>
          <td><textarea class="cell-input" data-field="zh" data-idx="${idx}" placeholder="中文翻譯...">${escapeHtml(row.zh)}</textarea></td>
          <td class="check"><input type="checkbox" data-idx="${idx}" ${row.done ? 'checked' : ''}></td>
          <td class="play"><button class="play-btn" data-idx="${idx}">🔊</button></td>
          <td class="del"><button class="del-btn" data-idx="${idx}" title="刪除這一句">✕</button></td>
        `;
        tbody.appendChild(tr);
      });

      tbody.querySelectorAll('textarea.cell-input').forEach(el => {
        el.addEventListener('input', () => {
          const idx = parseInt(el.dataset.idx, 10);
          const field = el.dataset.field;
          data[currentUnit].sentences[idx][field] = el.value;
          saveData();
        });
      });
      tbody.querySelectorAll('input[type="checkbox"]').forEach(el => {
        el.addEventListener('change', () => {
          const idx = parseInt(el.dataset.idx, 10);
          data[currentUnit].sentences[idx].done = el.checked;
          saveData();
          renderNav();
        });
      });
      tbody.querySelectorAll('.play-btn').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.idx, 10);
          speakText(data[currentUnit].sentences[idx].en, el);
        });
      });
      tbody.querySelectorAll('.del-btn').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.idx, 10);
          if(confirm('確定要刪除這一句嗎？')){
            data[currentUnit].sentences.splice(idx, 1);
            saveData();
            render();
          }
        });
      });
    }

    if(dlg.length > 0){
      const list = document.getElementById('dialogueList');
      dlg.forEach((line, idx) => {
        const row = document.createElement('div');
        row.className = 'dialogue-row speaker-' + line.speaker;
        row.innerHTML = `
          <div class="speaker-badge ${line.speaker}">${line.speaker}</div>
          <div class="dialogue-bubble">
            <div class="dialogue-bubble-top">
              <select class="speaker-select" data-idx="${idx}">
                <option value="A" ${line.speaker === 'A' ? 'selected' : ''}>A</option>
                <option value="B" ${line.speaker === 'B' ? 'selected' : ''}>B</option>
              </select>
              <button class="play-btn" data-idx="${idx}">🔊</button>
              <button class="del-btn" data-idx="${idx}" title="刪除這句台詞" style="margin-left:auto;">✕</button>
            </div>
            <textarea class="cell-input en" data-field="en" data-idx="${idx}" placeholder="English line...">${escapeHtml(line.en)}</textarea>
            <textarea class="cell-input zh-input" data-field="zh" data-idx="${idx}" placeholder="中文翻譯...">${escapeHtml(line.zh)}</textarea>
          </div>
        `;
        list.appendChild(row);
      });

      list.querySelectorAll('.speaker-select').forEach(el => {
        el.addEventListener('change', () => {
          const idx = parseInt(el.dataset.idx, 10);
          data[currentUnit].dialogue[idx].speaker = el.value;
          saveData();
          render();
        });
      });
      list.querySelectorAll('.dialogue-bubble textarea.cell-input').forEach(el => {
        el.addEventListener('input', () => {
          const idx = parseInt(el.dataset.idx, 10);
          const field = el.dataset.field;
          data[currentUnit].dialogue[idx][field] = el.value;
          saveData();
        });
      });
      list.querySelectorAll('.dialogue-bubble .play-btn').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.idx, 10);
          speakText(data[currentUnit].dialogue[idx].en, el);
        });
      });
      list.querySelectorAll('.dialogue-bubble .del-btn').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.idx, 10);
          if(confirm('確定要刪除這句台詞嗎？')){
            data[currentUnit].dialogue.splice(idx, 1);
            saveData();
            render();
          }
        });
      });
    }
  }

  function escapeHtml(str){
    if(!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function playAllInUnit(){
    const rows = data[currentUnit].sentences.filter(r => !r.done && r.en && r.en.trim());
    if(rows.length === 0){ alert('這個單元沒有「未背完」且有內容的句子可以播放。'); return; }
    let i = 0;
    function playNext(){
      if(i >= rows.length) return;
      const text = rows[i].en;
      i++;
      whenVoicesReady(() => {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = 0.85;
        const v = pickVoice('en-US');
        if(v) utter.voice = v;
        utter.onend = () => setTimeout(playNext, 400);
        window.speechSynthesis.speak(utter);
      });
    }
    playNext();
  }

  function playAllDialogue(){
    const lines = data[currentUnit].dialogue.filter(l => l.en && l.en.trim());
    if(lines.length === 0){ alert('這個單元還沒有可播放的對話內容。'); return; }
    let i = 0;
    function playNext(){
      if(i >= lines.length) return;
      const text = lines[i].en;
      i++;
      whenVoicesReady(() => {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = 0.85;
        const v = pickVoice('en-US');
        if(v) utter.voice = v;
        utter.onend = () => setTimeout(playNext, 500);
        window.speechSynthesis.speak(utter);
      });
    }
    playNext();
  }

  function render(){
    renderNav();
    renderMain();
  }

  // ---------- 匯出／匯入 ----------
  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '英文聽力練習_備份_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const imported = JSON.parse(reader.result);
        if(confirm('匯入備份會覆蓋目前瀏覽器裡的資料，確定要繼續嗎？')){
          data = imported;
          saveData();
          currentUnit = 0;
          render();
          alert('匯入完成！');
        }
      }catch(err){
        alert('這個檔案看起來不是有效的備份檔。');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  render();
</script>
</body>
</html>
